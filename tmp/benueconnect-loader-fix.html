<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#031b37"><title>BenueConnect</title><style>html,body{margin:0;background:#fff;font-family:system-ui}#boot{position:fixed;inset:0;display:grid;place-items:center;background:#fff;color:#082c5c}#boot:before{content:"";width:34px;height:34px;border:3px solid #dbe7ef;border-top-color:#0876d1;border-right-color:#00a347;border-radius:50%;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}pre{white-space:pre-wrap;padding:24px}</style></head><body><div id="boot"></div><script>(async()=>{try{const base='https://benueconnect-premium-live.vercel.app';const parts=[];let total=0;for(let i=0;i<7;i++){const r=await fetch(`${base}/p${i}.txt?v=20260902fix1`,{cache:'no-store'});if(!r.ok)throw new Error(`Unable to load page fragment ${i+1}`);let s=(await r.text()).replace(/[^A-Za-z0-9+/=]/g,'');if(!s)throw new Error(`Empty page fragment ${i+1}`);const bin=atob(s);const u=Uint8Array.from(bin,c=>c.charCodeAt(0));parts.push(u);total+=u.length}const raw=new Uint8Array(total);let off=0;for(const u of parts){raw.set(u,off);off+=u.length}const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([raw]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre>BenueConnect could not load. Please refresh the page.\n\n'+String(e)+'</pre>'}})();</script></body></html>
